<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hypo-3d lab</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<!--
  Test harness for <hypo-3d> (../hypo3d.js). Serve the route folder over http (ES modules don't
  load from file://), e.g.  python3 -m http.server 8765  then open /tools/hypo3d-lab.html
  Query params:
    stage=before|after|therapy|nonhormonal   initial stage
    t=4.2&still=1     freeze: run the model 4.2 s from the stage's settled state, no sway (deterministic)
    flash=1           freeze on A2's reduced-motion still (after: mid-flash; before: just after a burst)
    yaw=10&pitch=-3   view offsets in degrees (stills only)
    autotour=1        A2's idle tour      paused=1   start paused
    fit=0             don't scale the 1920×1080 frame to the window
    ui=0              hide the mock slide copy (element only)    box=1  outline the element box
    stats=1           live draw-call / triangle / fps readout
-->
<style>
  :root { --cream: #FFFCF7; --forest: #2C4E25; --sage: #87A482; --terra: #C05A3C; --bone: #DFD7CA; --muted: #76736D; }
  html, body { margin: 0; height: 100%; background: #e9e4da; overflow: hidden; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; background: var(--cream); overflow: hidden; }
  .fit-off .stage { left: 0; top: 0; transform: none !important; }
  .copy { position: absolute; left: 120px; top: 150px; width: 640px; font-family: "Public Sans", system-ui, sans-serif; color: var(--forest); }
  .eyebrow { display: flex; align-items: center; gap: 14px; font: 700 15px/1 "Public Sans", sans-serif; letter-spacing: 2.6px; text-transform: uppercase; color: var(--sage); }
  .eyebrow::before { content: ""; width: 32px; height: 1px; background: var(--sage); }
  h1 { margin: 26px 0 0; font: 400 64px/1.08 "Castoro", Georgia, serif; letter-spacing: -0.5px; }
  h1 i { font-style: italic; }
  .line { margin: 30px 0 0; font: 400 22px/1.5 "Public Sans", sans-serif; color: #3d4a38; min-height: 5.2em; max-width: 600px; }
  .seg { display: inline-flex; margin-top: 34px; padding: 5px; border: 1px solid var(--bone); border-radius: 999px; gap: 2px; }
  .seg button { font: 500 17px/1 "Public Sans", sans-serif; color: var(--forest); background: none; border: 0; border-radius: 999px; padding: 14px 20px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--forest); color: var(--cream); }
  .stats { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 44px; margin-top: 46px; justify-content: start; }
  .stats dt { font: 700 13px/1 "Public Sans", sans-serif; letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted); }
  .stats dd { margin: 10px 0 0; font: 400 30px/1.1 "Castoro", serif; color: var(--forest); }
  .flash { margin-top: 30px; font: 600 14px/1 "Public Sans", sans-serif; letter-spacing: 1.6px; text-transform: uppercase; color: var(--terra); opacity: 0; transition: opacity .3s; }
  .flash.on { opacity: 1; }
  hypo-3d { position: absolute; left: 800px; top: 150px; width: 1040px; height: 820px; }
  .box hypo-3d { outline: 1px dashed rgba(192, 90, 60, 0.5); }
  .ui-off .copy { display: none; }
  .perf { position: absolute; right: 16px; bottom: 12px; font: 500 13px/1.4 ui-monospace, monospace; color: var(--muted); white-space: pre; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="copy">
    <div class="eyebrow">Inside the thermostat</div>
    <h1>The hot-flash <i>switch</i>.</h1>
    <p class="line" id="line"></p>
    <div class="seg" role="group" aria-label="Menopause and treatment" id="seg">
      <button data-s="before">Before</button><button data-s="after">After</button><button data-s="therapy">Hormone therapy</button><button data-s="nonhormonal">Non-hormonal</button>
    </div>
    <dl class="stats">
      <div><dt>Estrogen</dt><dd id="r-estro"></dd></div>
      <div><dt>KNDy cell size</dt><dd id="r-size"></dd></div>
      <div><dt>Hot flashes</dt><dd id="r-rate"></dd></div>
    </dl>
    <div class="flash" id="flash">Hot flash</div>
  </div>
  <hypo-3d id="hypo"></hypo-3d>
  <div class="perf" id="perf"></div>
</div>
<script type="module">
  import "../hypo3d.js";
  const q = new URLSearchParams(location.search);
  const num = (k, d = 0) => (q.has(k) ? Number(q.get(k)) : d);
  const stageEl = document.getElementById("stage");
  if (q.get("fit") === "0") document.body.classList.add("fit-off");
  if (q.get("ui") === "0") document.body.classList.add("ui-off");
  if (q.get("box") === "1") document.body.classList.add("box");
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stageEl.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit();
  addEventListener("resize", fit);

  const el = document.getElementById("hypo");
  const STAGES = customElements.get("hypo-3d").STAGES;
  const buttons = [...document.querySelectorAll("#seg button")];
  const show = (s) => {
    const r = STAGES[s];
    document.getElementById("line").textContent = r.line;
    document.getElementById("r-estro").textContent = r.estrogen;
    document.getElementById("r-size").textContent = r.kndySize;
    document.getElementById("r-rate").textContent = r.hotFlashes;
    buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === s)));
  };
  el.addEventListener("hypo-stage", (e) => show(e.detail.stage));
  el.addEventListener("hypo-flash", (e) => document.getElementById("flash").classList.toggle("on", e.detail.on));
  buttons.forEach((b) => b.addEventListener("click", () => (el.stage = b.dataset.s)));
  // the deck navigates on clicks: prove the element swallows them
  stageEl.addEventListener("click", () => (window.__deckClicks = (window.__deckClicks || 0) + 1));

  const stage = q.get("stage") || "before";
  el.stage = stage;
  show(stage);
  if (q.get("autotour") === "1") el.autoTour = true;
  if (q.get("paused") === "1") el.pause();
  const still = q.get("still") === "1" || q.get("flash") === "1";
  requestAnimationFrame(() => {
    if (q.get("flash") === "1") el.renderStill({ yaw: num("yaw"), pitch: num("pitch") });
    else if (still) el.renderAt(num("t", 4), { yaw: num("yaw"), pitch: num("pitch") });
    requestAnimationFrame(() => (window.__ready = true));
  });
  if (q.get("stats") === "1") {
    const perf = document.getElementById("perf");
    setInterval(() => {
      const s = el.stats();
      if (s) perf.textContent = `${s.fps} fps · ${s.calls} calls · ${(s.triangles / 1000).toFixed(1)}k tris · ${s.width}×${s.height} @${s.dpr}x`;
    }, 500);
  }
  addEventListener("beforeprint", () => el.snapshotForPrint());
  addEventListener("afterprint", () => el.restoreFromPrint());
  window.__hypo = el;
</script>
</body>
</html>
